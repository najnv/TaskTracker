<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class = "app">
    <header class="top-bar">
        <div class="top-left">
            <div class="logo">
                <h1>Task Tracker</h1>
                <span>Управление задачами</span>
            </div>
        </div>
        <div class="top-center">
            <div class="header-stats">
                <div class="header-stat">
                    <span id="total-count">0</span>
                    <small>Всего</small>
                </div>
                <div class="header-stat">
                    <span id="active-count">0</span>
                    <small>Активных</small>
                </div>
                <div class="header-stat">
                    <span id="done-count">0</span>
                    <small>Выполнено</small>
                </div>
            </div>
        </div>
        <div class="top-right">
            <div class="archive-card-header">

                <div class="archive-card-top">

                    <div class="archive-card-info">
                        <h3>Архив задач</h3>
                        <p id="archiveCount">0 задач в архиве</p>
                    </div>

                    <button id="archive-btn" class="archive-btn">
                        Открыть →
                    </button>

                </div>

            </div>
        </div>

    </header>
    <main class = "workspace">
        <aside class = "sidebar">
            <div class = "panel">
                <div class = "panel-header">
                    <h2>Теги</h2>
                    <span class = "panel-description">Перетащите тег на карточку задачи</span>
                </div>
                <div class = "tag-form">
                    <input id = "new-tag-input" class ="tag-input" type = "text" placeholder="Введите название тега">
                    <button id = "add-tag-btn" class="add-tag-button" type = "button">Добавить</button>
                </div>
                <ul id="tag-list"></ul>
            </div>
        </aside>
        <section class = "content">
            <div class = "new-task-card">
                <h2>Новая задача</h2>
                <form id="task-form">
                <input id="task-title" type="text" placeholder="Введите название задачи">
                <button type = "submit">Добавить</button>
                </form>
            </div>
            <div class = "toolbar">
                <div class = "sort-controls">
                    <label>Сортировка</label>
                    <select id="sortBy">
                        <option value="createdAt">По дате</option>
                        <option value="title">По алфавиту</option>
                    </select>
                    <button id="sortToggle" type="button"></button>
                </div>
            </div>
            <div class = "task-section">
                <h2>Задачи</h2>
                <ul id="task-list"></ul>
            </div>
        </section>
    </main>
</div>
<div id="archive-overlay"></div>
<aside id="archive-panel">
    <div class="archive-header">
        <h2>Архив задач</h2>
        <button id="close-archive">✕</button>
    </div>
    <div id="archive-list"></div>
    <div class = "archive-footer">
        <button id="clear-archive-btn">Очистить архив</button>
    </div>
</aside>
<div id="subtask-modal" class="modal-overlay">
    <div class="modal">
        <h3>Новая подзадача</h3>
        <input id="subtask-input" type="text" placeholder="Введите название">
        <div class="modal-actions">
            <button id="subtask-cancel">Отмена</button>
            <button id="subtask-save">Добавить</button>
        </div>
    </div>
</div>
<div id="confirm-modal" class="modal-overlay">
    <div class="modal confirm-modal">
        <h3 id="confirm-title">Подтверждение</h3>

        <p id="confirm-text">
            Вы уверены, что хотите выполнить это действие?
        </p>

        <div class="modal-actions">
            <button id="confirm-cancel">Отмена</button>
            <button id="confirm-ok" class="danger-btn">
                Удалить
            </button>
        </div>
    </div>
</div>
<div id="toast-container"></div>
<script src="app.js"></script>
</body>
</html>
