<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
    <h1>Task Tracker</h1>
    <form id="task-form">
        <input id="task-title" type="text" placeholder="Введите задачу">
        <input id="task-tags" type="text" placeholder="Теги через запятую">
        <button type="submit">Добавить</button>
    </form>
    <div class="sort-controls">
        <label>Сортировать:</label>
        <select id = "sortBy">
            <option value = "createdAt"> По дате (новые) </option>
            <option value = "title"> По алфавиту </option>
        </select>
        <button id = "sortToggle" type = button>↑↓</button>
    </div>
    <ul id="task-list"></ul>
</main>
<script src="app.js"> </script>
</body>
</html>
