<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
    <header class = "top-bar">
        <div class="logo">
            <h1>Task Tracker</h1>
            <span>Управление задачами</span>
        </div>
        <button id="archive-btn" class = "archive-btn">
            Архив
        </button>
    </header>
    <div class="tag-management">
        <h3>Теги</h3>
        <div class="tag-form">
            <input id="new-tag-input" type="text" placeholder="Название тега">
            <button id="add-tag-btn" type="button">Добавить</button>
        </div>
        <ul id="tag-list"></ul>
    </div>
    <form id="task-form">
        <input id="task-title" type="text" placeholder="Введите задачу">
        <button type="submit">Добавить</button>
    </form>
    <div class="sort-controls">
        <label>Сортировать:</label>
        <select id = "sortBy">
            <option value = "createdAt"> По дате (новые) </option>
            <option value = "title"> По алфавиту </option>
        </select>
        <button id = "sortToggle" type = button>↑↓</button>
    </div>
    <ul id="task-list"></ul>
    <div id="trash-zone">
        <span> Перетащите сюда, чтобы удалить тег из задачи</span>
    </div>
</main>
<div id="archive-overlay"></div>
<aside id="archive-panel">
    <div class="archive-header">
    <h2>Архив задач</h2>
    <button id="close-archive"> ✕ </button>
    </div>
    <div id="archive-list"></div>
    <div class="archive-footer">
        <button id="clear-archive-btn"> Очистить архив </button>
    </div>
</aside>
<script src="app.js"> </script>
</body>
</html>
